# Production stack — images are pre-built in GitHub Actions and pushed to GHCR.
# This file contains NO build: directives; the server only pulls and runs images.
#
# Required environment variables (set in Coolify/Dokploy UI or .env):
#   GHCR_OWNER — your GitHub username/org (e.g. haimanotgetu)
#
# All other app env vars are loaded from env_file: .env as before.

name: beaconmon

x-web: &web
  image: ghcr.io/${GHCR_OWNER}/beaconmon-web:latest
  pull_policy: always
  restart: unless-stopped
  env_file: .env
  stop_grace_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-workers: &workers
  image: ghcr.io/${GHCR_OWNER}/beaconmon-workers:latest
  pull_policy: always
  restart: unless-stopped
  env_file: .env
  stop_grace_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *web
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy

  check-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:checks"]
    depends_on:
      redis:
        condition: service_healthy

  content-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:content"]
    depends_on:
      redis:
        condition: service_healthy

  alert-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:alerts"]
    depends_on:
      redis:
        condition: service_healthy

  escalation-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:escalation"]
    depends_on:
      redis:
        condition: service_healthy

  report-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:report"]
    depends_on:
      redis:
        condition: service_healthy

  # CLAUDE.md rule: scheduler must be a singleton. Never scale this above 1.
  scheduler:
    <<: *workers
    command: ["pnpm", "run", "start:scheduler"]
    deploy:
      replicas: 1
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction is mandatory for BullMQ — eviction would silently lose jobs.
    # AOF gives us durability across restarts so in-flight jobs survive.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - "noeviction"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
