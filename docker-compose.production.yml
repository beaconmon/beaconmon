# Production stack — images are pre-built in GitHub Actions and pushed to GHCR.
# This file contains NO build: directives; the server only pulls and runs images.
#
# Required environment variables (set in Coolify/Dokploy UI or .env):
#   GHCR_OWNER — your GitHub username/org (e.g. haimanotgetu)
#
# All other app env vars are loaded from env_file: .env as before.

name: beaconmon

# POSTGRES_USER, POSTGRES_PASSWORD must be set in .env.
# DATABASE_URL and DATABASE_URL_POOLED must point to the postgres service:
#   postgresql://<POSTGRES_USER>:<POSTGRES_PASSWORD>@postgres:5432/beaconmon
#
# Migrations run automatically via the `migrate` service on every `docker compose up`.
# To run migrations manually via SSH tunnel (useful before the first deploy):
#   ssh -L 5432:localhost:5432 user@server
#   then: DATABASE_URL=postgresql://...@localhost:5432/beaconmon pnpm db:migrate

x-web: &web
  image: ghcr.io/${GHCR_OWNER}/beaconmon-web:latest
  pull_policy: always
  restart: unless-stopped
  env_file: .env
  stop_grace_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-workers: &workers
  image: ghcr.io/${GHCR_OWNER}/beaconmon-workers:latest
  pull_policy: always
  restart: unless-stopped
  env_file: .env
  stop_grace_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    <<: *workers
    command: ["pnpm", "--filter", "@beaconmon/db", "exec", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *web
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  check-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:checks"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  content-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:content"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  alert-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:alerts"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  escalation-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:escalation"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  report-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:report"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  digest-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:digest"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  shopify-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:shopify"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  competitor-page-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:competitor-page"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  competitor-notify-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:competitor-notify"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  lifecycle-email-worker:
    <<: *workers
    command: ["pnpm", "run", "start:worker:lifecycle-email"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # CLAUDE.md rule: scheduler must be a singleton. Never scale this above 1.
  scheduler:
    <<: *workers
    command: ["pnpm", "run", "start:scheduler"]
    deploy:
      replicas: 1
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: beaconmon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tuned for 4 GB RAM (CPX21). Upgrade shared_buffers to 2GB on CPX31 (8 GB RAM).
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c wal_buffers=16MB
      -c max_connections=50
      -c checkpoint_timeout=10min
      -c max_wal_size=512MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d beaconmon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction is mandatory for BullMQ — eviction would silently lose jobs.
    # AOF gives us durability across restarts so in-flight jobs survive.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - "noeviction"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
