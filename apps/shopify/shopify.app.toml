# Beaconmon Shopify app configuration.
# Linked to "beaconmon-app" (client_id below) via `shopify app config link`.
# Local values here are the source of truth and are pushed on `shopify app deploy`
# (see include_config_on_deploy under [build]).
client_id = "abf2033a5ace4bcbc30b5e4058922e33"
name = "Store Intel by Beaconmon"
application_url = "https://store.beaconmon.com"
embedded = true
handle = "beaconmon-intel"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact",
  ]
  uri = "/webhooks/compliance"

[access_scopes]
# Minimal scopes. ZERO Protected Customer Data: never request orders or customers.
scopes = "read_products,read_inventory"

[auth]
redirect_urls = [
  "https://store.beaconmon.com/auth/callback",
]
