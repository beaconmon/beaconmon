name = "beaconmon-probe-sa-east"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
REGION_NAME = "sa-east"
# REGION_PROBE_SECRET is set via: wrangler secret put REGION_PROBE_SECRET --config wrangler.sa-east.toml

[[durable_objects.bindings]]
name = "PROBE_DO"
class_name = "ProbeDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProbeDurableObject"]
