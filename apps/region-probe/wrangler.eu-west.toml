name = "beaconmon-probe-eu-west"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
REGION_NAME = "eu-west"
# REGION_PROBE_SECRET is set via: wrangler secret put REGION_PROBE_SECRET --config wrangler.eu-west.toml

[[durable_objects.bindings]]
name = "PROBE_DO"
class_name = "ProbeDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["ProbeDurableObject"]
