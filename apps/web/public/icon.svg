<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="beaconmon-title">
  <title id="beaconmon-title">Beaconmon</title>
  <desc>Uptime monitoring beacon with concentric signal arcs radiating from a central point</desc>
  <style>
    .bg { fill: #0f172a; }
    .signal { stroke: #06b6d4; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f0f9ff; }
      .signal { stroke: #0284c7; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <path class="signal" d="M4 22a12 12 0 0 0 24 0" fill="none" stroke-width="2" stroke-linecap="round" opacity=".28"/>
  <path class="signal" d="M8 22a8 8 0 0 0 16 0" fill="none" stroke-width="2.2" stroke-linecap="round" opacity=".62"/>
  <path class="signal" d="M12 22a4 4 0 0 0 8 0" fill="none" stroke-width="2.5" stroke-linecap="round"/>
  <path class="signal" stroke-width="2" stroke-linecap="round" opacity=".45" d="M16 24.5V28"/>
  <circle cx="16" cy="22" r="2.5" fill="#06b6d4" class="signal-dot"/>
  <style>
    .signal-dot { fill: #06b6d4; }
    @media (prefers-color-scheme: light) {
      .signal-dot { fill: #0284c7; }
    }
  </style>
</svg>
