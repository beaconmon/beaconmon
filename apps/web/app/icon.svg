<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark slate rounded background -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Beacon signal arcs radiating upward (broadcast tower shape) -->
  <!-- Outer arc — faintest -->
  <path d="M 4 22 A 12 12 0 0 0 28 22"
        fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.28"/>
  <!-- Middle arc -->
  <path d="M 8 22 A 8 8 0 0 0 24 22"
        fill="none" stroke="#06b6d4" stroke-width="2.2" stroke-linecap="round" opacity="0.62"/>
  <!-- Inner arc — full brightness -->
  <path d="M 12 22 A 4 4 0 0 0 20 22"
        fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tower stem below the beacon dot -->
  <line x1="16" y1="24.5" x2="16" y2="28"
        stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

  <!-- Beacon source dot -->
  <circle cx="16" cy="22" r="2.5" fill="#06b6d4"/>
</svg>
