name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      skip_verify:
        description: "Skip typecheck/lint/tests and go straight to build+deploy"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name != 'push' &&
      github.event.inputs.skip_verify != 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name != 'push' &&
      github.event.inputs.skip_verify != 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beaconmon/db exec prisma generate
      - run: pnpm run typecheck

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name != 'push' &&
      github.event.inputs.skip_verify != 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beaconmon/db exec prisma generate
      - run: pnpm run test

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: |
      github.event_name != 'push' &&
      github.event.inputs.skip_verify != 'true' &&
      needs.changes.outputs.workers == 'true'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: beaconmon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/beaconmon_test
      DATABASE_URL_POOLED: postgresql://test:test@localhost:5432/beaconmon_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      ALERT_DRY_RUN: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beaconmon/db exec prisma generate
      - run: pnpm --filter @beaconmon/db exec prisma migrate deploy
      - run: pnpm --filter @beaconmon/workers run test:integration

  # Detect which service areas changed. Runs on push, dispatch, and PR.
  # Docker builds are gated on these outputs (push only) so unchanged images are skipped.
  # PRs use outputs to skip integration tests when no worker files changed.
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    outputs:
      web: ${{ steps.filter.outputs.web }}
      workers: ${{ steps.filter.outputs.workers }}
      shopify: ${{ steps.filter.outputs.shopify }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'Dockerfile.web'
              - 'pnpm-lock.yaml'
            workers:
              - 'apps/workers/**'
              - 'packages/**'
              - 'Dockerfile.workers'
              - 'pnpm-lock.yaml'
            shopify:
              - 'apps/shopify/**'
              - 'packages/**'
              - 'Dockerfile.shopify'
              - 'pnpm-lock.yaml'

  # Build the web image (Next.js standalone).
  # Pushes to GHCR only on push to main; skipped if no web/packages files changed.
  build-web:
    needs: [lint, typecheck, test-unit, test-integration, changes]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beaconmon-web:latest
            ghcr.io/${{ github.repository_owner }}/beaconmon-web:${{ github.sha }}
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_FREEMIUS_PRODUCT_ID=${{ secrets.NEXT_PUBLIC_FREEMIUS_PRODUCT_ID }}
            NEXT_PUBLIC_FREEMIUS_STARTER_PLAN_ID=${{ secrets.NEXT_PUBLIC_FREEMIUS_STARTER_PLAN_ID }}
            NEXT_PUBLIC_FREEMIUS_GROWTH_PLAN_ID=${{ secrets.NEXT_PUBLIC_FREEMIUS_GROWTH_PLAN_ID }}
            NEXT_PUBLIC_FREEMIUS_SCALE_PLAN_ID=${{ secrets.NEXT_PUBLIC_FREEMIUS_SCALE_PLAN_ID }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_CUSTOM_DOMAIN_CNAME_TARGET=${{ secrets.NEXT_PUBLIC_CUSTOM_DOMAIN_CNAME_TARGET }}
            NEXT_PUBLIC_INDEXNOW_KEY=${{ secrets.INDEXNOW_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Build the workers image. Skipped if no workers/packages files changed.
  build-workers:
    needs: [lint, typecheck, test-unit, test-integration, changes]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workers
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beaconmon-workers:latest
            ghcr.io/${{ github.repository_owner }}/beaconmon-workers:${{ github.sha }}
          cache-from: type=gha,scope=workers
          cache-to: type=gha,mode=max,scope=workers

  # Build the Shopify embedded app image. Skipped if no shopify/packages files changed.
  build-shopify:
    needs: [lint, typecheck, test-unit, test-integration, changes]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.shopify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.shopify
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beaconmon-shopify:latest
            ghcr.io/${{ github.repository_owner }}/beaconmon-shopify:${{ github.sha }}
          cache-from: type=gha,scope=shopify
          cache-to: type=gha,mode=max,scope=shopify

  # Trigger a redeploy once all relevant images are published.
  # Runs if at least one build succeeded and none failed/cancelled.
  deploy:
    needs: [build-web, build-workers, build-shopify]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      contains(needs.*.result, 'success')
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Trigger deployment
        run: |
          curl -fsSL -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"

      - name: Submit to IndexNow
        env:
          KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "INDEXNOW_KEY secret not set, skipping."
            exit 0
          fi
          URL_LIST=$(python3 << 'PYEOF'
          import re, json
          with open('apps/web/app/sitemap.ts') as f:
              content = f.read()
          paths = re.findall(r'url: `\$\{BASE_URL\}([^`]*)`', content)
          print(json.dumps(['https://beaconmon.com' + p for p in paths]))
          PYEOF
          )
          curl -fsSL -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\": \"beaconmon.com\", \"key\": \"$KEY\", \"keyLocation\": \"https://beaconmon.com/$KEY.txt\", \"urlList\": $URL_LIST}" || true
