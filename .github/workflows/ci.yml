name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: beaconmon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/beaconmon_test
      DATABASE_URL_POOLED: postgresql://test:test@localhost:5432/beaconmon_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      ALERT_DRY_RUN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @beaconmon/db exec prisma generate

      - run: pnpm --filter @beaconmon/db exec prisma migrate deploy

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test

      - run: pnpm --filter @beaconmon/workers run test:integration

      - run: pnpm run build

  # Build the web image (Next.js standalone). Runs in parallel with build-workers.
  # Pushes to GHCR only on push to main; on PRs it validates without pushing.
  build-web:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/beaconmon-web:latest
            ghcr.io/${{ github.repository_owner }}/beaconmon-web:${{ github.sha }}
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_FREEMIUS_PRODUCT_ID=${{ secrets.NEXT_PUBLIC_FREEMIUS_PRODUCT_ID }}
            NEXT_PUBLIC_FREEMIUS_STARTER_PLAN_ID=${{ secrets.NEXT_PUBLIC_FREEMIUS_STARTER_PLAN_ID }}
            NEXT_PUBLIC_FREEMIUS_GROWTH_PLAN_ID=${{ secrets.NEXT_PUBLIC_FREEMIUS_GROWTH_PLAN_ID }}
            NEXT_PUBLIC_FREEMIUS_SCALE_PLAN_ID=${{ secrets.NEXT_PUBLIC_FREEMIUS_SCALE_PLAN_ID }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_CUSTOM_DOMAIN_CNAME_TARGET=${{ secrets.NEXT_PUBLIC_CUSTOM_DOMAIN_CNAME_TARGET }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Build the workers image (tsx runtime, no compile step).
  # Runs in parallel with build-web.
  build-workers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workers
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/beaconmon-workers:latest
            ghcr.io/${{ github.repository_owner }}/beaconmon-workers:${{ github.sha }}
          cache-from: type=gha,scope=workers
          cache-to: type=gha,mode=max,scope=workers

  # Trigger a redeploy on the server once both images are published.
  # Only runs on push to main (not PRs).
  #
  # Set DEPLOY_WEBHOOK_URL in GitHub Actions secrets:
  #   Coolify: your stack's deploy webhook URL (includes token in query string)
  #   Dokploy: your project's deploy webhook URL
  deploy:
    needs: [build-web, build-workers]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5

    steps:
      - name: Trigger deployment
        run: |
          curl -fsSL -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
